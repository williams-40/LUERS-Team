version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: luers_postgres
    environment:
      POSTGRES_DB: luers_db
      POSTGRES_USER: luers_user
      POSTGRES_PASSWORD: luers_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luers_user -d luers_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: luers_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: