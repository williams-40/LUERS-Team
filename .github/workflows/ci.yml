name: CI

# This branch's backend/ folder is an independent, historical snapshot —
# it does not track apps.reports/apps.accounts/etc. changes made on
# fix/backend-blockers-pre-frontend (that branch has its own CI). Testing
# it here would just be validating a permanently-stale copy, so this
# workflow only covers frontend/, which is what's actually developed here.
on:
  push:
    branches: [feat/frontend-scaffold]
  pull_request:
    branches: [feat/frontend-scaffold]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
